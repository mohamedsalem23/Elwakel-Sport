<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Football/Soccer ball -->
  <circle cx="50" cy="50" r="45" fill="#fff" stroke="#000" stroke-width="2"/>
  
  <!-- Pentagon (black) -->
  <g fill="#000">
    <polygon points="50,20 65,35 60,55 40,55 35,35"/>
  </g>
  
  <!-- Hexagons (black) -->
  <g fill="#000" opacity="0.8">
    <polygon points="65,35 80,40 80,60 65,65 50,60 55,45"/>
    <polygon points="35,35 20,40 20,60 35,65 50,60 45,45"/>
    <polygon points="60,55 75,60 75,80 60,85 45,80 50,65"/>
    <polygon points="40,55 25,60 25,80 40,85 55,80 50,65"/>
  </g>
</svg>